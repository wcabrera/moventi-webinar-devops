name: DevOps Webinar CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:

  # ---------------------------------------------------------------------
  # Source
  # ---------------------------------------------------------------------
  source:
    name: Source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      environment: ${{ steps.meta.outputs.environment }}
    steps:
      - name: Resolve app / environment / version
        id: meta
        run: |
          ENVIRONMENT="staging"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            ENVIRONMENT="production"
          fi
          echo "Aplicacion: moventi-webinar-devops"
          echo "Ambiente:   ${ENVIRONMENT}"
          echo "Version:    ${{ github.sha }}"
          echo "version=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Build & Test
  # ---------------------------------------------------------------------
  build-test:
    name: Build & Test
    needs: source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit + Integration Testing (with coverage gate)
        run: mvn -B clean verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: API Testing (black-box)
        run: |
          java -jar target/moventi-webinar-devops-1.0.0.jar &
          APP_PID=$!

          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "App is up"
              break
            fi
            sleep 2
          done

          curl -sf "http://localhost:8080/api/v1/hello?name=William" | grep -q "Hola William"
          curl -sf "http://localhost:8080/api/v1/time" | grep -q "timestamp"

          kill $APP_PID

  # ---------------------------------------------------------------------
  # Quality & Security
  # ---------------------------------------------------------------------
  sonarqube:
    name: Quality & Security / SonarQube
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: mvn -B clean verify

      - name: SonarQube Cloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.token=${SONAR_TOKEN}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: target/sonar/report-task.txt

  sast:
    name: Quality & Security / SAST (CodeQL)
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build for CodeQL
        run: mvn -B -DskipTests clean compile

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  secrets-scan:
    name: Quality & Security / Secrets (Gitleaks)
    needs: source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # Package & Publish
  # ---------------------------------------------------------------------
  package-publish:
    name: Package & Publish
    needs: [sonarqube, sast, secrets-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Containers / Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  # ---------------------------------------------------------------------
  # Deploy & Validate
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy & Validate
    needs: package-publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deploy script to EC2
        run: |
          scp \
            -i ~/.ssh/ec2_key \
            -r \
            ./scripts \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/devops-webinar-scripts

      - name: Deploy (pull image + run) — timeout 5m
        timeout-minutes: 5
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "
              cd /opt/devops-webinar-scripts &&
              chmod +x deploy.sh &&
              echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin &&
              ./deploy.sh ${{ env.IMAGE }} ${{ github.sha }}
            "

      - name: Health Check (with retries)
        run: |
          curl \
            --fail \
            --retry 8 \
            --retry-delay 5 \
            --retry-connrefused \
            http://${{ secrets.EC2_HOST }}/api/v1/hello

  dast:
    name: Deploy & Validate / DAST (OWASP ZAP)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://${{ secrets.EC2_HOST }}/api/v1/hello'
          fail_action: false
          cmd_options: '-a'

  # ---------------------------------------------------------------------
  # Governance & Monitoring
  # ---------------------------------------------------------------------
  report:
    name: Governance & Monitoring / Reporte
    needs: [source, build-test, sonarqube, sast, secrets-scan, package-publish, deploy, dast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate pipeline report
        run: |
          {
            echo "## Pipeline Report — moventi-webinar-devops"
            echo ""
            echo "**Version:** \`${{ needs.source.outputs.version }}\`"
            echo "**Environment:** ${{ needs.source.outputs.environment }}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Source | ${{ needs.source.result }} |"
            echo "| Build & Test | ${{ needs.build-test.result }} |"
            echo "| SonarQube | ${{ needs.sonarqube.result }} |"
            echo "| SAST (CodeQL) | ${{ needs.sast.result }} |"
            echo "| Secrets (Gitleaks) | ${{ needs.secrets-scan.result }} |"
            echo "| Package & Publish | ${{ needs.package-publish.result }} |"
            echo "| Deploy | ${{ needs.deploy.result }} |"
            echo "| DAST (ZAP) | ${{ needs.dast.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
