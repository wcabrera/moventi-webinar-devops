name: DevOps Webinar CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build-test-sonar:

    name: Build Test Sonar

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Build and Test
        run: |
          mvn clean verify


      - name: SonarQube Cloud Analysis

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |

          mvn sonar:sonar \
            -Dsonar.token=${SONAR_TOKEN}



  deploy:

    name: Deploy EC2

    needs:
      - build-test-sonar

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Configure SSH

        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" \
          > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan \
            -H ${{ secrets.EC2_HOST }} \
            >> ~/.ssh/known_hosts


      - name: Copy project to EC2

        run: |

          ssh \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "rm -rf /opt/devops-webinar/*"


          scp \
            -i ~/.ssh/ec2_key \
            -r \
            ./* \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/devops-webinar/


      - name: Build Docker and Deploy

        run: |

          ssh \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "
              cd /opt/devops-webinar &&

              chmod +x scripts/deploy.sh &&

              ./scripts/deploy.sh \
              ${{ github.sha }}
            "


      - name: Health Check

        run: |

          sleep 10

          curl \
            --fail \
            http://${{ secrets.EC2_HOST }}/api/v1/hello
